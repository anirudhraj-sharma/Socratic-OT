name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci-backend.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.txt pytest
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run backend tests
        env:
          SESSIONS_DB_PATH: ${{ runner.temp }}/socratic-ot-sessions.db
        run: >
          python -m pytest -q
          backend/test_api_chat.py
          backend/test_checkpointer_persistence.py
          backend/test_config_paths.py
          backend/test_crag_isolation.py
          backend/test_dean_revision_exhaustion.py
          backend/test_graph_state.py
          backend/test_idk_reset.py
          backend/test_mode_dispatch.py
          backend/test_node_helpers.py
          backend/test_stream_chat.py
          backend/test_study_node.py
          backend/test_study_prompt.py
          backend/test_trace_collector.py
          backend/evaluation/test_faithfulness_aggregation.py
      - name: Validate Compose
        run: docker compose --env-file .env.example --profile seed --profile ollama config --quiet
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t socratic-ot-backend:ci backend
      - name: Check container health endpoint
        run: |
          docker run --rm -d --name socratic-ot-ci -p 127.0.0.1:8000:8000 socratic-ot-backend:ci
          trap 'docker logs socratic-ot-ci; docker stop socratic-ot-ci' EXIT
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/health \
            | python -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
