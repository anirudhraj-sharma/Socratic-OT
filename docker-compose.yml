services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8000"
      SESSIONS_DB_PATH: /var/lib/socratic-ot/sessions/sessions.db
      CHROMA_DIR: /var/lib/socratic-ot/chroma/index
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - sessions:/var/lib/socratic-ot/sessions
      - chroma:/var/lib/socratic-ot/chroma
    depends_on:
      ollama-model:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  seed-chroma:
    image: python:3.12-slim
    profiles: [seed]
    volumes:
      - type: bind
        source: ./backend/data/processed/chroma_db
        target: /seed
        read_only: true
        bind:
          create_host_path: false
      - chroma:/volume
    entrypoint: [sh, -ec]
    command:
      - |
        if [ ! -f /seed/chroma.sqlite3 ]; then
          echo 'No Chroma index found. Run local ingestion first.' >&2
          exit 1
        fi
        if [ -e /volume/index ]; then
          echo 'The Chroma volume already contains an index.' >&2
          exit 1
        fi
        staging=$$(mktemp -d /volume/.seed.XXXXXX)
        trap 'rm -rf -- "$$staging"' EXIT
        cp -a /seed/. "$$staging/"
        mv -T "$$staging" /volume/index

  ollama:
    image: ollama/ollama:0.17.7
    profiles: [ollama]
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 3s
      retries: 12

  ollama-model:
    image: ollama/ollama:0.17.7
    profiles: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: [ollama]
    command: [pull, "${EMBED_MODEL:-nomic-embed-text}"]

volumes:
  sessions:
  chroma:
  ollama-models:
